services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PATH: /app/data/shotorko.sqlite
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shotorko.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - shotorko-data:/app/data
    expose:
      - "4000"

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  shotorko-data:
